apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: mautic-apache
spec:
  title: 'Mautic Apache'
  url: 'https://www.mautic.org/'
  gitRepo: 'https://github.com/mautic/mautic'
  author: 'Sealos'
  description: 'Mautic is the world''s largest open source marketing automation software - Apache version with RabbitMQ 4 & MySQL 8.4 (KubeBlocks).'
  readme: 'https://raw.githubusercontent.com/mautic/mautic/refs/heads/6.x/README.md'
  icon: 'https://avatars.githubusercontent.com/u/5257677?s=48&v=4'
  templateType: inline
  locale: en
  i18n:
    zh:
      title: 'Mautic Apache'
      description: 'Mautic 是一款开源的营销自动化平台 - Apache版本，包含RabbitMQ 4 和 KubeBlocks MySQL 8.4。'
  categories:
    - tool
  defaults:
    app_host:
      type: string
      value: mautic-${{ random(8) }}
    app_name:
      type: string
      value: mautic-${{ random(8) }}
  inputs:
    TIMEZONE:
      description: 'defaults to UTC'
      type: choice
      options:
        - UTC
        - Asia/Shanghai
      required: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mysql

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mysql
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mysql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-mysql
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-mysql

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  finalizers:
    - cluster.kubeblocks.io/finalizer
  labels:
    clusterdefinition.kubeblocks.io/name: mysql
    clusterversion.kubeblocks.io/name: mysql-8.4.2
  name: ${{ defaults.app_name }}-mysql
spec:
  affinity:
    nodeLabels: {}
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys: []
  clusterDefinitionRef: mysql
  clusterVersionRef: mysql-8.4.2
  componentSpecs:
    - componentDefRef: mysql
      monitor: true
      name: mysql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-mysql
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi

  terminationPolicy: Delete
  tolerations: []

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-mysql-init
spec:
  completions: 1
  template:
    spec:
      containers:
        - name: mysql-init
          image: joseluisq/mysql-client:8.4
          imagePullPolicy: IfNotPresent
          env:
            - name: MAUTIC_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MAUTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: MAUTIC_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MAUTIC_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
          command:
            - /bin/sh
            - -c
            - |
              until mysql -h $MAUTIC_HOST -P $MAUTIC_PORT -u $MAUTIC_USER -p$MAUTIC_PASSWORD -e 'CREATE DATABASE IF NOT EXISTS mautic;'; do sleep 1; done
      restartPolicy: Never
  backoffLimit: 0
  ttlSecondsAfterFinished: 300

---
apiVersion: v1
kind: Secret
metadata:
  name: ${{ defaults.app_name }}-rabbitmq
type: Opaque
stringData:
  username: mautic
  password: ${{ random(16) }}
  vhost: mautic

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-rabbitmq
  labels:
    app: ${{ defaults.app_name }}-rabbitmq
spec:
  replicas: 1
  serviceName: ${{ defaults.app_name }}-rabbitmq
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-rabbitmq
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-rabbitmq
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-rabbitmq
                  key: password
            - name: RABBITMQ_DEFAULT_VHOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-rabbitmq
                  key: vhost
          ports:
            - containerPort: 5672
              name: amqp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-rabbitmq
  labels:
    app: ${{ defaults.app_name }}-rabbitmq
spec:
  ports:
    - port: 5672
      name: amqp
  selector:
    app: ${{ defaults.app_name }}-rabbitmq

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: mautic/mautic:latest
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      initContainers:
        - name: take-data-dir-ownership
          image: mautic/mautic:latest
          command: 
            - "/bin/sh"
            - "-c"
            - |
              if [ -z "$(ls -A /data/config)" ]; then
                cp -rn /var/www/html/config/* /data/config/
              fi
              if [ -z "$(ls -A /data/media/files)" ]; then
                cp -rn /var/www/html/docroot/media/files/* /data/media/files/
              fi
              if [ -z "$(ls -A /data/media/images)" ]; then
                cp -rn /var/www/html/docroot/media/images/* /data/media/images/
              fi
              chown -R www-data:www-data /data
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: vn-varvn-wwwvn-htmlvn-config
              mountPath: /data/config
            - name: vn-varvn-wwwvn-htmlvn-varvn-logs
              mountPath: /data/logs
            - name: vn-varvn-wwwvn-htmlvn-docrootvn-mediavn-files
              mountPath: /data/media/files
            - name: vn-varvn-wwwvn-htmlvn-docrootvn-mediavn-images
              mountPath: /data/media/images
            - name: vn-optvn-mauticvn-cron
              mountPath: /data/cron
      containers:
        - name: ${{ defaults.app_name }}
          image: mautic/mautic:latest
          env:
            - name: PHP_INI_VALUE_DATE_TIMEZONE
              value: "${{ inputs.TIMEZONE }}"
            - name: DOCKER_MAUTIC_RUN_MIGRATIONS
              value: 'false'
            - name: DOCKER_MAUTIC_LOAD_TEST_DATA
              value: 'false'
            # DB Config
            - name: MAUTIC_DB_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MAUTIC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: MAUTIC_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: MAUTIC_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MAUTIC_DB_DATABASE
              value: mautic
            # RabbitMQ Config
            - name: MAUTIC_RABBITMQ_HOST
              value: ${{ defaults.app_name }}-rabbitmq
            - name: MAUTIC_RABBITMQ_PORT
              value: '5672'
            - name: MAUTIC_RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-rabbitmq
                  key: username
            - name: MAUTIC_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-rabbitmq
                  key: password
            - name: MAUTIC_RABBITMQ_VHOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-rabbitmq
                  key: vhost
          resources:
            requests:
              cpu: 10m
              memory: 51Mi
            limits:
              cpu: 100m
              memory: 512Mi
          ports:
            - name: http
              protocol: TCP
              containerPort: 80
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost/
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost/
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: vn-varvn-wwwvn-htmlvn-config
              mountPath: /var/www/html/config
            - name: vn-varvn-wwwvn-htmlvn-varvn-logs
              mountPath: /var/www/html/var/logs
            - name: vn-optvn-mauticvn-cron
              mountPath: /opt/mautic/cron
            - name: vn-varvn-wwwvn-htmlvn-docrootvn-mediavn-files
              mountPath: /var/www/html/docroot/media/files
            - name: vn-varvn-wwwvn-htmlvn-docrootvn-mediavn-images
              mountPath: /var/www/html/docroot/media/images
        
        # CRON CONTAINER
        - name: ${{ defaults.app_name }}-cron
          image: mautic/mautic:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PHP_INI_VALUE_DATE_TIMEZONE
              value: "${{ inputs.TIMEZONE }}"
            - name: DOCKER_MAUTIC_ROLE
              value: "mautic_cron"
            - name: MAUTIC_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: ${{ defaults.app_name }}-mysql-conn-credential
            - name: MAUTIC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: ${{ defaults.app_name }}-mysql-conn-credential
            - name: MAUTIC_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: ${{ defaults.app_name }}-mysql-conn-credential
            - name: MAUTIC_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: ${{ defaults.app_name }}-mysql-conn-credential
            - name: MAUTIC_DB_DATABASE
              value: mautic
            - name: MAUTIC_RABBITMQ_HOST
              value: ${{ defaults.app_name }}-rabbitmq
            - name: MAUTIC_RABBITMQ_PORT
              value: '5672'
            - name: MAUTIC_RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-rabbitmq
                  key: username
            - name: MAUTIC_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-rabbitmq
                  key: password
            - name: MAUTIC_RABBITMQ_VHOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-rabbitmq
                  key: vhost
          resources:
            requests:
              cpu: 10m
              memory: 51Mi
            limits:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - mountPath: /var/www/html/config
              name: vn-varvn-wwwvn-htmlvn-config
            - mountPath: /var/www/html/var/logs
              name: vn-varvn-wwwvn-htmlvn-varvn-logs
            - mountPath: /opt/mautic/cron
              name: vn-optvn-mauticvn-cron
            - name: vn-varvn-wwwvn-htmlvn-docrootvn-mediavn-files
              mountPath: /var/www/html/docroot/media/files
            - name: vn-varvn-wwwvn-htmlvn-docrootvn-mediavn-images
              mountPath: /var/www/html/docroot/media/images

        # WORKER CONTAINER
        - name: ${{ defaults.app_name }}-worker
          image: mautic/mautic:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PHP_INI_VALUE_DATE_TIMEZONE
              value: "${{ inputs.TIMEZONE }}"
            - name: DOCKER_MAUTIC_ROLE
              value: "mautic_worker"
            - name: MAUTIC_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: ${{ defaults.app_name }}-mysql-conn-credential
            - name: MAUTIC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: ${{ defaults.app_name }}-mysql-conn-credential
            - name: MAUTIC_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: ${{ defaults.app_name }}-mysql-conn-credential
            - name: MAUTIC_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: ${{ defaults.app_name }}-mysql-conn-credential
            - name: MAUTIC_DB_DATABASE
              value: mautic
            - name: MAUTIC_RABBITMQ_HOST
              value: ${{ defaults.app_name }}-rabbitmq
            - name: MAUTIC_RABBITMQ_PORT
              value: '5672'
            - name: MAUTIC_RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-rabbitmq
                  key: username
            - name: MAUTIC_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-rabbitmq
                  key: password
            - name: MAUTIC_RABBITMQ_VHOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-rabbitmq
                  key: vhost
          resources:
            requests:
              cpu: 10m
              memory: 51Mi
            limits:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - mountPath: /var/www/html/config
              name: vn-varvn-wwwvn-htmlvn-config
            - mountPath: /var/www/html/var/logs
              name: vn-varvn-wwwvn-htmlvn-varvn-logs
            - mountPath: /opt/mautic/cron
              name: vn-optvn-mauticvn-cron
            - name: vn-varvn-wwwvn-htmlvn-docrootvn-mediavn-files
              mountPath: /var/www/html/docroot/media/files
            - name: vn-varvn-wwwvn-htmlvn-docrootvn-mediavn-images
              mountPath: /var/www/html/docroot/media/images
      volumes: []
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /var/www/html/config
          value: '1'
        name: vn-varvn-wwwvn-htmlvn-config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        annotations:
          path: /var/www/html/var/logs
          value: '1'
        name: vn-varvn-wwwvn-htmlvn-varvn-logs
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        annotations:
          path: /opt/mautic/cron
          value: '1'
        name: vn-optvn-mauticvn-cron
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-varvn-wwwvn-htmlvn-docrootvn-mediavn-files
        annotations:
          path: /var/www/html/docroot/media/files
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-varvn-wwwvn-htmlvn-docrootvn-mediavn-images
        annotations:
          path: /var/www/html/docroot/media/images
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - port: 80
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: "https://avatars.githubusercontent.com/u/5257677?s=48&v=4"
  name: "Mautic Apache"
  type: link
